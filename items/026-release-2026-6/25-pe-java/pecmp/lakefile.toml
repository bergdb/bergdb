# bergdb 026-25: pecmp, the tree checker's PE (lean/SIS/Tree/Pe.lean) against the proved
# writer (lean/contract/Contract/PeWriter.lean, Contract.PE.peTx) on Java's traces. The
# contract's files that PeWriter.lean imports need neither Mathlib nor lean/SIS, so they are
# built here from lean/contract's sources, into this package's .lake; lean/contract is not
# built or changed.
name = "pecmp"
version = "0.1.0"
defaultTargets = ["pecmp"]

[[require]]
name = "sis"
path = "../../../../lean"

[[lean_lib]]
name = "ContractPe"
srcDir = "../../../../lean/contract"
roots = ["Contract.Tree", "Contract.Read", "Contract.Statement", "Contract.Reach", "Contract.Shape",
         "Contract.Top", "Contract.PeWriter"]

[[lean_exe]]
name = "pecmp"
root = "PeCmp"
